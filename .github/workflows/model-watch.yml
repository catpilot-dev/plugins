name: Upstream model watch

# Daily digest feeding the maintainer's test-drive queue. Schedule drift is
# accepted: dedup is keyed on commit SHA, not a time window, so a skipped run
# loses nothing — the next run reports the same candidates.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be filed without creating issues'
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # GitHub fires `schedule` only from the DEFAULT branch, so the copy of
      # this file that actually runs lives there — development happens on dev.
      # Pin the checkout to dev regardless of which branch hosts the trigger:
      # the script reads compatible_models.json to decide what is new, so it
      # must read the catalog we develop against, not a release branch's
      # frozen copy. Keep the two copies of this file identical.
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pytest

      - name: Test the watch script
        run: python -m pytest .github/scripts/tests -q

      - name: Check upstream for new models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/model_watch.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}
